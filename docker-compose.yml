version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/nexod.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SESSION_SECRET=${SESSION_SECRET}
      - LLM_MODEL=${LLM_MODEL:-claude-3-haiku-20240307}
      - CONFIDENCE_THRESHOLD=0.6
      - LEGACY_FAILURE_RATE=0.05
      - DAILY_COST_LIMIT_USD=10.00
    volumes:
      - nexod-data:/app/data
    restart: unless-stopped

volumes:
  nexod-data: